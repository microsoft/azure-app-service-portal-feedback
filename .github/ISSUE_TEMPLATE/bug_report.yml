name: Bug report
description: Report a reproducible problem in the Azure App Service experience in the Azure portal.
title: "[Bug]: "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the Azure App Service portal experience.

        Do not include secrets, access tokens, personal information, subscription IDs, resource IDs, or resource names. Security vulnerabilities must be reported privately to the Microsoft Security Response Center.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the problem.
      placeholder: The portal fails to...
    validations:
      required: true

  - type: input
    id: workflow
    attributes:
      label: Affected workflow
      description: Which Azure App Service portal page, blade, tab, or workflow is affected?
      placeholder: For example, Create Web App or Configuration
    validations:
      required: true

  - type: input
    id: timestamp
    attributes:
      label: Approximate time and time zone
      description: When did the problem occur? Include your time zone.
      placeholder: 2026-09-02 2:30 PM Central Time
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: Include the browser name and version.
      placeholder: Microsoft Edge 140
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the minimum steps needed to reproduce the problem.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include exact error text when safe to share.
    validations:
      required: true

  - type: input
    id: correlation
    attributes:
      label: Correlation or request ID
      description: Optional. Include a portal correlation or request ID if one was shown and it is safe to share.

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Optional. Drag files here after removing private resource details and personal information.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets, tokens, personal information, subscription IDs, resource IDs, and resource names.
          required: true
        - label: This is not a security vulnerability or a request for urgent Azure support.
          required: true
