name: Bug report
description: Report a problem in the Azure App Service experience in the Azure portal.
title: "[Bug]: "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the Azure App Service portal experience.

        This public issue tracker is not an Azure Support channel. For production incidents, billing, or account and subscription help, [contact Azure Support](https://azure.microsoft.com/support/create-ticket/).

        Do not include secrets, access tokens, personal information, subscription IDs, resource IDs, or resource names. Report security vulnerabilities privately to the [Microsoft Security Response Center](https://aka.ms/security.md).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What's the bug? Describe what you saw in plain language.
      value: |
        Summary:

        Screenshots or recording:

        Console errors:
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce. What was the actual behavior? What was the expected behavior?
      description: Describe how to reproduce the bug and what you expected to happen.
      value: |
        1.
        2.
        3.

        Actual behavior:

        Expected behavior:
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: This information is filled in automatically when you report a problem from App Service.
      value: |
        page:
        route:
        version:
        browser:
        host:
        timestamp:
        sessionId:
    validations:
      required: true
