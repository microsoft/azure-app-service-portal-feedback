name: Bug report
description: Report a problem in the Azure App Service experience in the Azure portal.
title: "[Bug]: "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the Azure App Service portal experience.

        This public issue tracker is not an Azure Support channel. For production incidents, billing, or account and subscription help, [contact Azure Support](https://azure.microsoft.com/support/create-ticket/).

        Do not include secrets, access tokens, personal information, subscription IDs, resource IDs, or resource names. Report security vulnerabilities privately to the [Microsoft Security Response Center](https://aka.ms/security.md).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem in your own words. Add any steps, screenshots, recordings, or other context that may help.
      placeholder: Tell us what happened.
    validations:
      required: true
